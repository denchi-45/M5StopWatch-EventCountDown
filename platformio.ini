; M5StopWatchi_CountDown
;
; The default environment builds a MultiFirm *guest* image for the M5StopWatch.
; `pio run` only builds. `pio run -t upload` / `erase` / `uploadfs` are blocked by
; tools/upload_guard.py, because a normal full-device upload overwrites the
; wararyoLauncher host and the coexistence partition table. Install the built
; firmware.bin into a guest slot with the MultiFirm PC tool instead (README.md).

[platformio]
default_envs = m5stopwatch

[common]
lib_deps =
    m5stack/M5GFX @ 0.2.28
    m5stack/M5Unified @ 0.2.16
    bblanchon/ArduinoJson @ 7.2.1
    https://github.com/wararyo/M5StopWatch-MultiFirm.git#v1.1.0

[env:m5stopwatch]
platform = espressif32 @ 6.12.0
framework = arduino
board = esp32s3box
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.embed_txtfiles = web/index.html
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCD_MULTIFIRM_GUEST=1
lib_deps = ${common.lib_deps}
; The guard must stay the first PRE script (it runs before lib_deps are fetched).
extra_scripts = pre:tools/upload_guard.py
custom_allow_full_upload = no

; Same firmware for a StopWatch that does NOT run wararyoLauncher.
; This erases/overwrites the whole flash layout: only use it on a standalone unit.
[env:m5stopwatch-standalone]
extends = env:m5stopwatch
custom_allow_full_upload = yes

; Portability check: rectangular M5Unified device (ESP32, 320x240, touch).
; No MultiFirm guest support; the bridge compiles to no-ops.
[env:m5stack-core2]
platform = espressif32 @ 6.12.0
framework = arduino
board = m5stack-core2
monitor_speed = 115200
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.embed_txtfiles = web/index.html
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    m5stack/M5GFX @ 0.2.28
    m5stack/M5Unified @ 0.2.16
    bblanchon/ArduinoJson @ 7.2.1
extra_scripts = pre:tools/upload_guard.py
custom_allow_full_upload = yes
