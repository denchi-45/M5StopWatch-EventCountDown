; EventCountDown
;
; ESP-IDF build (like wararyoLauncher), so the app can use DFS and automatic
; light sleep (sdkconfig.defaults). The default environment builds a MultiFirm
; *guest* image for the M5StopWatch. `pio run` only builds.
; `pio run -t upload` / `erase` / `uploadfs` are blocked by tools/upload_guard.py,
; because a normal full-device upload overwrites the wararyoLauncher host and the
; coexistence partition table. Install the built firmware.bin into a guest slot
; with the MultiFirm PC tool instead (README.md).

[platformio]
default_envs = m5stopwatch

[env:m5stopwatch]
platform = espressif32 @ 6.12.0
framework = espidf
board = m5stack-cores3
; Standalone layout only (env:m5stopwatch-standalone). A guest installed into a
; MultiFirm slot runs under the host's partition table.
board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
; The ESP-IDF component (src/CMakeLists.txt) declares the same file with
; EMBED_TXTFILES; PlatformIO generates the assembly that the build needs.
board_build.embed_txtfiles = web/index.html
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    m5stack/M5GFX @ 0.2.28
    m5stack/M5Unified @ 0.2.16
    bblanchon/ArduinoJson @ 7.2.1
    https://github.com/wararyo/M5StopWatch-MultiFirm.git#v1.1.0
build_flags =
    -DBOARD_HAS_PSRAM
    -DCD_MULTIFIRM_GUEST=1
    -Wno-error=maybe-uninitialized
; The guard must stay the first PRE script (it runs before lib_deps are fetched).
extra_scripts = pre:tools/upload_guard.py
custom_allow_full_upload = no

; Same firmware for a StopWatch that does NOT run wararyoLauncher.
; This erases/overwrites the whole flash layout: only use it on a standalone unit.
[env:m5stopwatch-standalone]
extends = env:m5stopwatch
custom_allow_full_upload = yes

; PC simulator (SDL2): the StopWatch screens and controls in a 466x466 window.
; Needs g++ and SDL2 on PATH (Windows: MSYS2 UCRT64, see docs/DEVELOPMENT.md).
; Wi-Fi / web setup / NTP / Launcher are stubbed out (sim/), NVS and the RTC are
; emulated under sim_data/. Run: pio run -e native -t exec
[env:native]
platform = native
extra_scripts = pre:tools/native_env.py
build_flags =
    -std=gnu++17
    -O1
    -DSDL_MAIN_HANDLED
    -DM5GFX_BOARD=board_M5StopWatch
    -Isim/include
    -include sim/include/sim_compat.h
    -lSDL2
build_src_filter =
    +<*>
    -<main.cpp>
    -<hal/RtcHal.cpp>
    -<hal/KvStore.cpp>
    -<hal/PowerHal.cpp>
    -<hal/UiTask.cpp>
    -<services/NetworkService.cpp>
    -<services/NtpSync.cpp>
    -<services/WebConfigServer.cpp>
    +<../sim/>
lib_deps =
    m5stack/M5GFX @ 0.2.28
    m5stack/M5Unified @ 0.2.16
    bblanchon/ArduinoJson @ 7.2.1
